{% extends "base.html" %}
{% block title %}{{ group.name }}{% endblock %}
{% block content %}
  <p><a href="{{ url_for('home') }}">← Home</a></p>
  <h1>{{ group.name }}</h1>

  <h2>Members</h2>
  <ul>
    {% for m in members %}<li>{{ m.display_name }}</li>{% endfor %}
  </ul>

  <h2>Invite link</h2>
  <input value="{{ invite_url }}" readonly onclick="this.select()" style="width:100%">
{% endblock %}
