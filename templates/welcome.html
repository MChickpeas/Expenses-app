{% extends "base.html" %}
{% block title %}Welcome{% endblock %}
{% block content %}
  <h1>Welcome!</h1>
  <p>You're signed in as {{ g.email }}. What should your friends call you?</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input name="display_name" maxlength="80" required autofocus>
    <button type="submit">Create account</button>
  </form>
{% endblock %}
